services:
  - type: web
    name: dnd-narrator-bot
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        sync: false
    healthCheckPath: /health
    autoDeploy: true
